  <h1>Obsidian Sync</h1>
  <p>Obsidian Syncは、個人のObsidian保管庫と本人のGoogle Drive内のフォルダを双方向に同期するためのOAuthアプリです。同期はObsidianのコミュニティプラグインGSyncが端末上で行います。</p>
  <p>Google Driveに既にあるファイルを読み取り、差分に応じてダウンロード、アップロード、ごみ箱への移動を行うため、Google Driveへのアクセスを求めます。</p>
